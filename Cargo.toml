[package]
name = "j-jump"
version = "0.0.34"
edition = "2024"
rust-version = "1.88"
description = "Independent directory navigation with optional Jev suggestions"
license = "MIT"
publish = false

[[bin]]
name = "jjump"
path = "src/main.rs"

[[bin]]
name = "j-jump"
path = "src/bin/j-jump.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
unicode-normalization = "0.1"
unicode-casefold = "0.2"
zeroize = "1"
rpassword = "7"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy", "socks"] }
libc = "0.2"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[[example]]
name = "setup-credentials-fixture"
path = "tests/fixtures/setup_credentials.rs"
